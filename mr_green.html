<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mr. Green Likes</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #ecfdf5, #f8fafc);
      color: #102018;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 560px;
      background: white;
      border-radius: 24px;
      box-shadow: 0 24px 70px rgba(15, 23, 42, 0.14);
      padding: 32px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 5vw, 3rem);
      line-height: 1;
    }

    .subtitle {
      margin: 0 0 24px;
      color: #4b5563;
      font-size: 1.05rem;
    }

    form {
      display: grid;
      gap: 16px;
    }

    label {
      display: grid;
      gap: 8px;
      font-weight: 700;
      color: #374151;
    }

    input {
      width: 100%;
      font: inherit;
      font-size: 1.15rem;
      border: 1px solid #d1d5db;
      border-radius: 14px;
      padding: 12px 14px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: #16a34a;
      box-shadow: 0 0 0 4px rgba(22, 163, 74, 0.14);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    button {
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, background 0.15s;
    }

    button:hover {
      transform: translateY(-1px);
    }

    .check-button {
      background: #16a34a;
      color: white;
      box-shadow: 0 10px 24px rgba(22, 163, 74, 0.28);
    }

    .reset-button {
      background: #e5e7eb;
      color: #111827;
    }

    .result {
      margin-top: 22px;
      border-radius: 18px;
      padding: 18px;
      font-size: 1.15rem;
      font-weight: 800;
      display: none;
      overflow-wrap: anywhere;
    }

    .result.show {
      display: block;
    }

    .result.likes {
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      color: #065f46;
    }

    .result.dislikes {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
    }

    .result.error {
      background: #fffbeb;
      border: 1px solid #fde68a;
      color: #92400e;
    }

    @media (max-width: 520px) {
      .card {
        padding: 24px;
      }

      .actions button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Mr. Green Likes</h1>
    <p class="subtitle">Type one word to see whether Mr. Green likes it.</p>

    <form id="greenForm">
      <label>
        Word
        <input id="wordInput" type="text" autocomplete="off" required />
      </label>

      <div class="actions">
        <button class="check-button" type="submit">Check word</button>
        <button class="reset-button" type="button" id="resetButton">Reset</button>
      </div>
    </form>

    <div id="result" class="result" role="status" aria-live="polite"></div>
  </main>

  <script>
    (() => {
      const $ = (id) => document.getElementById(id);
      const form = $("greenForm");
      const input = $("wordInput");
      const result = $("result");

      const single = (value) => /^[A-Za-z]+$/.test(value);
      const green = (value) => /([A-Za-z])\1/i.test(value);

      const show = (message, type) => {
        result.textContent = message;
        result.className = `result show ${type}`;
      };

      form.addEventListener("submit", (event) => {
        event.preventDefault();

        const word = input.value.trim();

        if (!single(word)) {
          show("Please enter a single word.", "error");
          return;
        }

        if (green(word)) {
          show(`Mr. Green likes ${word}`, "likes");
        } else {
          show(`Mr. Green does NOT like ${word}`, "dislikes");
        }
      });

      $("resetButton").addEventListener("click", () => {
        form.reset();
        result.className = "result";
        result.textContent = "";
        input.focus();
      });
    })();
  </script>
</body>
</html>
